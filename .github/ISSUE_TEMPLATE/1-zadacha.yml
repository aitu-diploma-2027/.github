name: Задача
description: Задача по дипломному проекту (код, записка, документы)
title: "[Задача] "
body:
  - type: textarea
    id: what
    attributes:
      label: Что сделать
      description: Коротко и конкретно, одна задача — один результат.
      placeholder: "Например: форма записи на приём сохраняет данные в базу"
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Критерий готовности
      description: Как руководитель поймёт, что задача выполнена?
      placeholder: "Например: есть коммит, скриншот работающей формы, запись видна в БД"
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Тип задачи
      description: Не забудь поставить такую же метку (код / записка / документы).
      options:
        - Код
        - Пояснительная записка
        - Документы (ТЗ, отзывы, нормоконтроль)
    validations:
      required: true
  - type: input
    id: due
    attributes:
      label: Срок
      placeholder: "ДД.ММ.ГГГГ (дату также поставь в поле «Срок» на доске)"
