name: Вопрос руководителю
description: Застрял или нужно решение руководителя
title: "[Вопрос] "
labels: ["вопрос"]
body:
  - type: textarea
    id: question
    attributes:
      label: В чём вопрос
      description: Опиши проблему так, чтобы её можно было понять без созвона.
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: Что уже пробовал
      description: Ссылки на коммиты, ошибки, скриншоты.
    validations:
      required: true
  - type: dropdown
    id: urgency
    attributes:
      label: Насколько срочно
      options:
        - Работа стоит, нужен ответ как можно скорее
        - Можно обсудить на ближайшей встрече
    validations:
      required: true
