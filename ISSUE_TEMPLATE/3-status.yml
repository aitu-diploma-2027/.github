name: Еженедельный статус
description: Создаётся ОДИН раз в начале работы. Дальше — каждую неделю комментарий в этой задаче.
title: "Еженедельный статус — Фамилия Имя"
labels: ["статус"]
body:
  - type: markdown
    attributes:
      value: |
        Эта задача — твой дневник работы над дипломом. Создай её один раз, закрепи (Pin issue) и **не закрывай** до защиты.

        Каждую неделю в установленный день оставляй в ней комментарий по шаблону:

        ```
        Неделя N
        Сделал: …
        Дальше: …
        Застрял: … (или «нет»)
        Ссылки: коммиты / PR / задачи
        ```
  - type: input
    id: student
    attributes:
      label: ФИО
    validations:
      required: true
  - type: textarea
    id: topic
    attributes:
      label: Тема диплома (KZ / RU)
    validations:
      required: true
  - type: input
    id: thesis-link
    attributes:
      label: Ссылка на пояснительную записку (Google Docs / Word Online)
